[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odos"
version = "0.1.0"
description = "ODOS pipeline: legal PDFs to a canonical document model and Custom Legal JSON 2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.143,<3",
    "pydantic>=2.10,<3",
    "jsonschema>=4.20",
    "fastapi>=0.115",  # the thin web API (odos.api)
    "python-multipart>=0.0.9",  # PDF upload
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odos = "odos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # the synthetic documents (tests/synthetic_*.py)
# `pytest` runs the public suite; the private suite (tests/private/, gitignored) runs only with `pytest tests/private`
norecursedirs = ["private", ".*", "*.egg", "build", "dist", "venv", "node_modules", "__pycache__"]
addopts = "-rs"  # always show why a test was skipped (missing fixtures are reported, never silent)
markers = ["slow: runs the real Docling conversion on a PDF"]
