[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odos"
version = "0.1.0"
description = "ODOS pipeline: legal PDFs to a canonical document model and Custom Legal JSON 2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.143,<3",
    "pydantic>=2.10,<3",
    "jsonschema>=4.20",
    "fastapi>=0.115",  # the thin web API (odos.api)
    "python-multipart>=0.0.9",  # PDF upload
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.40,<2",  # Amazon Bedrock client (odos.llm); reads the Bedrock API key from AWS_BEARER_TOKEN_BEDROCK
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7"]

[project.scripts]
odos = "odos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Phase 1 (blocking): pyflakes (F) and syntax errors (E9xx) only.
# Zero existing violations — catches real bugs without touching style.
# Phase 2 (future): add "I" after fixing 39 existing I001 import-sort violations.
# Phase 3 (future): add "E", "W" after addressing E501 line-length in the codebase.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # tests/private/ imports conftest and golden_outputs like the tests next to it
addopts = "-rs"  # always show why a test was skipped (missing fixtures are reported, never silent)
markers = ["slow: runs the real Docling conversion on a PDF"]
