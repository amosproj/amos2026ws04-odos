name: CI

# Minimal GITHUB_TOKEN permissions; cache and registry operations use separate tokens.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest, no slow tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: odos_ci
          POSTGRES_PASSWORD: odos_ci
          POSTGRES_DB: odos_test
        options: >-
          --health-cmd "pg_isready -U odos_ci -d odos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e '.[dev]'

      - name: Run tests
        # Exclude slow tests (require real PDF files and full Docling conversion).
        # Database tests run against the postgres service container above;
        # they are skipped automatically when POSTGRES_USER/PASSWORD are absent.
        run: |
          pytest -m "not slow" \
            --cov=src/odos \
            --cov-fail-under=70 \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          POSTGRES_USER: odos_ci
          POSTGRES_PASSWORD: odos_ci
          POSTGRES_DB: odos_test
          POSTGRES_HOST: 127.0.0.1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        # Supply dummy values for the required runtime variables so compose can
        # interpolate them without connecting to any real service.
        run: docker compose config --quiet
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: odos_ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    # Two existing ReDoS findings in transitive deps (opentelemetry-api 1.45.1,
    # soupsieve 3.0.4) that are not reachable via ODOS's PDF-upload surface.
    # Marked continue-on-error so PRs are not blocked on third-party fixes, but
    # every run still surfaces the current finding count visibly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock

      - name: Audit npm dependencies
        # --package-lock-only reads package-lock.json without a full npm ci;
        # fails if any vulnerability is found in the locked dependency tree.
        run: npm audit --package-lock-only
        working-directory: frontend
