# Local PostgreSQL 17 for the ODOS database proof of concept (see Documentation/database-poc.md).
# Credentials come from .env (copy .env.example); the port is bound to localhost only.
services:
  postgres:
    image: postgres:17-alpine
    container_name: odos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # creates the schema on the first start with an empty volume only; existing databases are not touched
      - ./backend/db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ODOS_DATABASE_ENABLED: "1"
      ODOS_STORAGE_DIR: /data/odos-storage
      ODOS_RULE_EXTRACTION_ARCHIVE_DIR: /data/rule-extraction-results
      ODOS_RULE_EXTRACTION_REPORT_DIR: /data/rule-extraction-reports
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Amazon Bedrock for LLM rule extraction (optional, `odos extract-rules`; see Documentation/bedrock-rule-extraction.md).
      # The API key comes from .env and is only passed into this container; without it the backend works as before.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      ODOS_BEDROCK_REGION: ${ODOS_BEDROCK_REGION:-eu-central-1}
      ODOS_BEDROCK_MODEL_ID: ${ODOS_BEDROCK_MODEL_ID:-eu.anthropic.claude-sonnet-4-6}
      ODOS_BEDROCK_MAX_TOKENS: ${ODOS_BEDROCK_MAX_TOKENS:-32000}
      ODOS_BEDROCK_OUTPUT_RETRIES: ${ODOS_BEDROCK_OUTPUT_RETRIES:-1}  # 0 or 1 paid re-request for an answer that is not valid JSON
      ODOS_RULE_EXTRACTION_MAX_QUEUED: ${ODOS_RULE_EXTRACTION_MAX_QUEUED:-3}
    volumes:
      - model-cache:/root/.cache
      - backend_storage:/data/odos-storage
      - ./dev-fixtures/bedrock-extraction-results:/data/rule-extraction-results
      - ./dev-fixtures/Reports_for_results:/data/rule-extraction-reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        repo: . # the root-level sbom.spdx.json, which the Legal Notices page is built from
    environment:
      ODOS_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  model-cache:
  backend_storage:
